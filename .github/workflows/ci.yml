name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Unit tests
        run: make test
      - name: Race tests
        run: make race
      - name: Public-repository safety
        run: make public-check
      - name: Public-repository safety self-test
        run: make public-check-selftest
      - name: Diff check
        run: make diff-check
      - name: Committed diff check
        env:
          VBDB_EVENT_NAME: ${{ github.event_name }}
          VBDB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          VBDB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: make diff-check-ci
